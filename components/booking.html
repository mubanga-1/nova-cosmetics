<section class="container booking">
  <div class="booking__header">
    <h2 class="heading">Book Your Transformation</h2>
    <p>Schedule your consultation with our AI booking assistant</p>
  </div>
  <form class="glass-panel form booking__form">
    <div class="grid grid--1x2 input-group">
      <div class="input-wrapper">
        <label for="name" class="input-label">Full Name</label>
        <div>
          <input class="input" type="text" id="name" />
        </div>
      </div>
      <div class="input-wrapper">
        <label for="email" class="input-label">Email</label>
        <div>
          <input class="input" type="email" id="email" />
        </div>
      </div>
      <div class="input-wrapper">
        <label for="phone" class="input-label">Phone</label>
        <div>
          <input class="input" type="text" id="phone" />
        </div>
      </div>
      <div class="input-wrapper">
        <label for="treatment" class="input-label">Treatment interest</label>
        <div>
          <select id="treatment" class="input">
            <option selected disabled>Select a treatment</option>
            <option value="nano-botox">Nano Botox</option>
            <option value="plasma-lift">Plasma lift</option>
            <option value="laser-resurfacing">Laser Resurfacing</option>
            <option value="stem-cell">Stem Cell Facial</option>
            <option value="lip-enhancement">Lip Enhancement</option>
            <option value="bio-filler">Bio Filler</option>
            <option value="consultation">Consultation Only</option>
          </select>
        </div>
      </div>
      <div class="input-wrapper">
        <label for="date" class="input-label">Preferred Date</label>
        <div>
          <input class="input" type="date" id="date" />
        </div>
      </div>
      <div class="input-wrapper">
        <label for="time" class="input-label">Preferred Time</label>
        <div>
          <select class="input" id="time">
            <option selected disabled>Select a time</option>
            <option value="morning">Morning (9am-12pm)</option>
            <option value="afternoon">Afternoon (12pm-4pm)</option>
            <option value="evening">Evening (4pm-7pm)</option>
          </select>
        </div>
      </div>
      <div class="input-wrapper">
        <label for="requests" class="input-label">Special Requests</label>
        <div>
          <textarea class="input form__textarea" id="requests"></textarea>
        </div>
      </div>
    </div>
    <button class="btn btn--primary btn--block form__button">
      Virtual Consultation
    </button>
  </form>
</section>
